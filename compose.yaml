services:
  octotools:
    build:
      context: .
    image: octotools-local:py310
    container_name: octotools
    working_dir: /workspace/octotools
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - type: bind
        source: .
        target: /workspace/octotools
    env_file:
      - .env
    environment:
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:-octotools}"
